# FutureVisor 어드민 AI 분석 서버 (로컬 PC 상시 가동)
#
# 사용법:
#   docker compose up -d --build   # 빌드 + 백그라운드 실행
#   docker compose logs -f fv-ai   # 로그 확인
#   docker compose restart fv-ai   # 재시작 (코드 변경 시)
#   docker compose down            # 정지
#
# Docker Desktop이 OS 부팅 시 자동 실행되도록 설정해두면 (Settings → General → Start Docker Desktop when you sign in)
# 컨테이너도 restart: unless-stopped 정책에 의해 자동 기동됨.

services:
  fv-ai:
    build:
      context: .
      dockerfile: ai-server.Dockerfile
    container_name: fv-ai-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # 호스트의 Claude Code OAuth 자격증명을 컨테이너에 그대로 마운트
      # Windows: C:\Users\<user>\.claude → /root/.claude
      - "${USERPROFILE:-$HOME}/.claude:/root/.claude:ro"
    environment:
      - FV_AI_MODEL=claude-sonnet-4-6
      # ANTHROPIC_API_KEY 는 의도적으로 비워둠 (OAuth 세션 사용)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
