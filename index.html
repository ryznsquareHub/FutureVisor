    <!-- JSON-LD: FAQPage (검색 리치 결과용) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "FutureVisor는 어떤 서비스인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FutureVisor는 단순 자동화 툴이나 외주 개발이 아니라, 기업의 핵심 업무 흐름을 분석하고 5주 단위로 단계적으로 자동화·시스템화하는 기업 맞춤형 자동화·운영 시스템 구축 서비스입니다. ERP, CRM, 재고·정산·보고 등 회사 운영에 직접 영향을 주는 업무를 기업 프로세스에 맞게 설계·개발합니다."
          }
        },
        {
          "@type": "Question",
          "name": "Zapier나 Make 같은 자동화 툴과 무엇이 다른가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zapier/Make는 앱을 연결하는 자동화 툴이고, FutureVisor는 기업 업무 프로세스 자체를 설계·개발하는 서비스입니다. 기업 고유 로직 100% 반영, 대량 데이터·복잡한 분기 처리, 국내 API(카카오, 토스 등) 연동, 전용 서버·DB 기반 보안 구조 등 ERP/CRM 수준의 로직 구현이 가능합니다."
          }
        },
        {
          "@type": "Question",
          "name": "어떤 회사에 적합한 서비스인가요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "직원 5~100명 규모의 중소·중견기업, 업무가 엑셀·카톡·메일·수기로 운영되는 회사, ERP/CRM이 우리 회사 방식과 맞지 않는 조직, 내부 개발팀이 없거나 매우 소규모인 회사에 가장 적합합니다. 개인 프로젝트나 단순 자동화 목적에는 적합하지 않습니다."
          }
        },
        {
          "@type": "Question",
          "name": "프로젝트는 어떤 방식으로 진행되나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FutureVisor 프로젝트는 5주 단위(1사이클)로 운영됩니다. 각 사이클은 업무 분석 → 설계 → 개발 → QA → 개선 단계를 포함하며, 보통 1~5사이클 범위에서 기업 상황에 맞게 진행됩니다. 전사 시스템을 한 번에 만드는 방식이 아니라, 핵심 모듈부터 단계적으로 확장하는 구조입니다."
          }
        },
        {
          "@type": "Question",
          "name": "프로젝트 최소 비용은 어떻게 되나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "1사이클(5주) 기준 1,000만 원부터 시작되며, 첫 진단(1H)은 30만 원이며 본 계약 체결 시 전액 환급됩니다."
          }
        },
        {
          "@type": "Question",
          "name": "우리 회사도 자동화가 가능한지 먼저 확인할 수 있나요?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "네. FutureVisor에서는 자동화 가능성 체크와 유료 업무 진단(컨설팅)을 통해 귀사에 적합한 자동화 범위와 방향을 먼저 제안드립니다."
          }
        }
      ]
    }
